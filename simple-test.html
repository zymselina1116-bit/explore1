<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Three.js Test</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="info">Loading...</div>
    <script type="module">
        import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
        
        document.getElementById('info').textContent = 'THREE.js version: ' + THREE.REVISION;
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        
        const textGeometry = new THREE.PlaneGeometry(3, 1);
        const textMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const textPlane = new THREE.Mesh(textGeometry, textMaterial);
        textPlane.position.set(0, 2, 0);
        scene.add(textPlane);
        
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        
        console.log('Animation starting');
        animate();
    </script>
</body>
</html>
