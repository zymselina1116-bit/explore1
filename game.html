<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploration Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: Arial, sans-serif; }
        #backpack {
            position: fixed; top: 20px; right: 20px; width: 60px; height: 60px;
            background: rgba(0, 0, 0, 0.7); border: 3px solid #fff; border-radius: 10px;
            cursor: pointer; z-index: 1000;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M17 6h-2V3c0-.55-.45-1-1-1h-4c-.55 0-1 .45-1 1v3H7c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2 0 .55.45 1 1 1h8c.55 0 1-.45 1-1 1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM9.5 18H8V9h1.5v9zm3.25 0h-1.5V9h1.5v9zm3.25 0H14V9h1.5v9zm.5-12h-9V3.5h9V6z"/></svg>');
            background-size: 70%; background-repeat: no-repeat; background-position: center;
        }
        #inventory-panel {
            position: fixed; top: 100px; right: 20px; width: 300px; min-height: 100px;
            max-height: 500px; background: rgba(0, 0, 0, 0.9); border: 3px solid #fff;
            border-radius: 10px; display: none; padding: 20px; overflow-y: auto; z-index: 999;
        }
        #inventory-panel.open { display: block; }
        .inventory-item {
            width: 80px; height: 80px; margin: 10px; display: inline-block;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            cursor: pointer; border: 2px solid #fff; border-radius: 5px;
        }
        #photo-viewer {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; height: 600px; background-size: contain; background-repeat: no-repeat;
            background-position: center; background-color: rgba(0, 0, 0, 0.95);
            border: 5px solid #fff; display: none; z-index: 2000; cursor: pointer;
        }
        #photo-viewer.show { display: block; }
        #end-message {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; color: #fff; background: rgba(0, 0, 0, 0.9);
            padding: 40px 60px; border-radius: 20px; display: none; z-index: 3000; text-align: center;
        }
        #end-message.show { display: block; }
    </style>
</head>
<body>
    <div id="backpack"></div>
    <div id="inventory-panel"></div>
    <div id="photo-viewer"></div>
    <div id="end-message"></div>
    
    <script type="module">
        import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
        
        console.log('Game script loaded, THREE version:', THREE.REVISION);
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);
        
        camera.position.set(0, 2.5, 0);
        scene.background = new THREE.Color(0x000000);
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        // Test cube
        const testCube = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        testCube.position.set(0, 2.5, -3);
        scene.add(testCube);
        
        const textureLoader = new THREE.TextureLoader();
        const inventory = [];
        const collectedEvidence = new Set();
        const interactiveObjects = [];
        const worldObjects = [];
        
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };
        let yaw = 0;
        let pitch = 0;
        const moveState = { forward: false, backward: false, left: false, right: false };
        
        function loadTexture(path) {
            const texture = textureLoader.load(
                path,
                () => console.log('Loaded:', path),
                undefined,
                (err) => console.error('Error loading:', path, err)
            );
            texture.encoding = THREE.sRGBEncoding;
            return texture;
        }
        
        // Create simple room
        const roomSize = 15;
        const wallHeight = 5;
        
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(roomSize, roomSize),
            new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        scene.add(floor);
        worldObjects.push(floor);
        
        const wallGeometry = new THREE.PlaneGeometry(roomSize, wallHeight);
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
        
        const wallNorth = new THREE.Mesh(wallGeometry, wallMaterial.clone());
        wallNorth.position.set(0, wallHeight / 2, -roomSize / 2);
        scene.add(wallNorth);
        worldObjects.push(wallNorth);
        
        const wallSouth = new THREE.Mesh(wallGeometry, wallMaterial.clone());
        wallSouth.position.set(0, wallHeight / 2, roomSize / 2);
        wallSouth.rotation.y = Math.PI;
        scene.add(wallSouth);
        worldObjects.push(wallSouth);
        
        const wallWest = new THREE.Mesh(wallGeometry, wallMaterial.clone());
        wallWest.position.set(-roomSize / 2, wallHeight / 2, 0);
        wallWest.rotation.y = Math.PI / 2;
        scene.add(wallWest);
        worldObjects.push(wallWest);
        
        const wallEast = new THREE.Mesh(wallGeometry, wallMaterial.clone());
        wallEast.position.set(roomSize / 2, wallHeight / 2, 0);
        wallEast.rotation.y = -Math.PI / 2;
        scene.add(wallEast);
        worldObjects.push(wallEast);
        
        const redLight = new THREE.PointLight(0xff0000, 2, 15);
        redLight.position.set(0, wallHeight - 0.5, 0);
        scene.add(redLight);
        
        // Mouse controls
        function onMouseDown(event) {
            if (event.button === 0) {
                isMouseDown = true;
                previousMousePosition = { x: event.clientX, y: event.clientY };
            }
        }
        
        function onMouseUp(event) {
            if (event.button === 0) {
                isMouseDown = false;
            }
        }
        
        function onMouseMove(event) {
            if (isMouseDown) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                
                yaw -= deltaX * 0.002;
                pitch -= deltaY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                
                previousMousePosition = { x: event.clientX, y: event.clientY };
            }
        }
        
        document.addEventListener('mousedown', onMouseDown);
        document.addEventListener('mouseup', onMouseUp);
        document.addEventListener('mousemove', onMouseMove);
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') moveState.backward = true;
            if (e.key === 's' || e.key === 'S') moveState.forward = true;
            if (e.key === 'a' || e.key === 'A') moveState.right = true;
            if (e.key === 'd' || e.key === 'D') moveState.left = true;
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') moveState.backward = false;
            if (e.key === 's' || e.key === 'S') moveState.forward = false;
            if (e.key === 'a' || e.key === 'A') moveState.right = false;
            if (e.key === 'd' || e.key === 'D') moveState.left = false;
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        function checkCollision(newPos) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(
                newPos,
                new THREE.Vector3(0.8, 4, 0.8)
            );
            
            for (const obj of worldObjects) {
                const objBox = new THREE.Box3().setFromObject(obj);
                if (playerBox.intersectsBox(objBox)) {
                    return true;
                }
            }
            return false;
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const quaternion = new THREE.Quaternion();
            quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            camera.quaternion.copy(quaternion);
            
            const speed = 0.1;
            const moveDir = new THREE.Vector3();
            
            if (moveState.forward) moveDir.z += 1;
            if (moveState.backward) moveDir.z -= 1;
            if (moveState.left) moveDir.x += 1;
            if (moveState.right) moveDir.x -= 1;
            
            if (moveDir.length() > 0) {
                moveDir.normalize();
                moveDir.applyQuaternion(camera.quaternion);
                moveDir.y = 0;
                moveDir.normalize();
                
                const newPos = camera.position.clone().add(moveDir.multiplyScalar(speed));
                newPos.y = 2.5;
                
                if (!checkCollision(newPos)) {
                    camera.position.copy(newPos);
                }
            }
            
            testCube.rotation.x += 0.01;
            testCube.rotation.y += 0.01;
            
            renderer.render(scene, camera);
        }
        
        console.log('Starting animation loop');
        animate();
    </script>
</body>
</html>
