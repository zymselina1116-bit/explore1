<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploration Room Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Scene Title -->
        <div id="scene-title">Industrial Hall</div>

        <!-- Controls Panel -->
        <div id="controls-panel">
            <h3>Controls</h3>
            <p>WASD - Move</p>
            <p>Mouse - Look Around</p>
            <p>Click - Interact</p>
            <p>ESC - Unlock Mouse</p>
        </div>

        <!-- Inventory -->
        <div id="inventory-panel">
            <h3>Inventory</h3>
            <div id="inventory-items"></div>
        </div>

        <!-- Interaction Hint -->
        <div id="interaction-hint"></div>

        <!-- Message Display -->
        <div id="message-display"></div>
    </div>

    <!-- Click to Start -->
    <div id="start-screen" style="display: none;">
        <h1>Exploration Room Game</h1>
        <p>Click to Start</p>
        <div class="instructions">
            <p>Find your way through the mysterious facility...</p>
            <p>Collect items, unlock doors, discover the truth.</p>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" style="display: none;">
        <h1>THE END</h1>
        <p>Thanks for Playing</p>
        <button id="restart-btn">Play Again</button>
    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
