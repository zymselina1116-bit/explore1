<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Hall - Exploration Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Scene Title -->
        <div id="scene-title">Industrial Hall</div>

        <!-- Controls Panel -->
        <div id="controls-panel">
            <h3>Controls</h3>
            <p>WASD / Arrows - Move</p>
            <p>Mouse - Look</p>
            <p>Click - Lock pointer</p>
            <p>Double-click - Pick up items</p>
            <p>ESC - Unlock pointer</p>
        </div>

        <!-- Inventory Button -->
        <div id="inventory-button">Inventory</div>

        <!-- Inventory Panel (hidden by default) -->
        <div id="inventory-panel" class="hidden">
            <div class="panel-header">
                <h3>Inventory</h3>
                <button id="close-inventory">×</button>
            </div>
            <div id="inventory-items">
                <p class="empty-message">Inventory is empty</p>
            </div>
        </div>

        <!-- Crosshair -->
        <div id="crosshair"></div>

        <!-- Hint Text -->
        <div id="hint-text"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
