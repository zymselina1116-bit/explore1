<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Hall - Exploration Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Crosshair -->
        <div id="crosshair"></div>

        <!-- Message Display -->
        <div id="message-display" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.9); color: #ff4444; padding: 30px 60px; border-radius: 10px; font-size: 24px; font-weight: bold; border: 3px solid #ff4444; z-index: 1000;"></div>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
